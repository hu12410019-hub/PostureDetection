<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GymGuard - Login</title>

    <link
        rel="stylesheet"
        href="css/login.css">
        <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<header>

    <div class="logo">
        GYMGUARD
    </div>

    <nav>


        <a href="register.html">
            Register
        </a>

    </nav>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">

            <div class="brand-icon">
                🏋️
            </div>

            <p class="small-heading">
                WELCOME BACK
            </p>

            <h1>
                Login
            </h1>

            <p>
                Continue your AI-powered workout journey.
            </p>

        </div>


        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>


            <div
                id="loginMessage"
                class="auth-message">
            </div>


            <button
                type="submit"
                class="auth-button">

                Login

            </button>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</main>


<script src="js/login.js"></script>

</body>

</html>
