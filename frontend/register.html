<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GymGuard - Register</title>

    <link
        rel="stylesheet"
        href="css/register.css">
        <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<header>

    <div class="logo">
        GYMGUARD
    </div>

    <nav>


        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">

            <div class="brand-icon">
                🏋️
            </div>

            <p class="small-heading">
                GYMGUARD
            </p>

            <h1>
                Create Account
            </h1>

            <p>
                Start your AI-powered fitness journey.
            </p>

        </div>


        <form id="registerForm">

            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required>

            </div>


            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                    required>

            </div>


            <div
                id="registerMessage"
                class="auth-message">
            </div>


            <button
                type="submit"
                class="auth-button">

                Create Account

            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script src="js/register.js"></script>

</body>

</html>
